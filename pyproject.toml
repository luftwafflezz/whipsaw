[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "whipsaw"
authors = [
    {name = "Ian Vidricksen", email = "ividricksen@gmail.com"},
]
description = "A CD-DA ripper prioritising accuracy over speed (a fork of whipper)"
requires-python = ">=3.9"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "musicbrainzngs",
    "mutagen",
    "pycdio",
    "ruamel.yaml",
    "packaging",
    "setuptools_scm",
    "discid",
]
dynamic = ["version"]

[project.urls]
Home = "https://github.com/luftwafflezz/whipsaw"

[project.optional-dependencies]
cover_art = ["pillow", "requests"]
docs = ["docutils"]
test = ["flake8", "twisted"]

[project.scripts]
whipsaw = "whipsaw.command.main:main"

# This is necessary, since whipsaw uses a flat-layout, but has as a 'src'
# directory and setuptools gets confused otherwise.
[tool.setuptools.packages.find]
include = ["whipsaw*"]
namespaces = true

[tool.setuptools.package-data]
"whipsaw" = ["test/**"]

[tool.setuptools_scm]
# Empty, but needed to enable SCM
